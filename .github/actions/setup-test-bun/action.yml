name: Setup test Bun
description: Install the checksum-pinned Linux x64 Bun fork used by test lanes.
runs:
  using: composite
  steps:
    - name: Install pinned Bun test runtime
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS/$RUNNER_ARCH" != "Linux/X64" ]]; then
          echo "::error::The pinned Bun test runtime requires Linux/X64."
          exit 1
        fi

        # Built from steipete/bun commit 9ebee1257c3bcf6ca9764f408c2432ad9e8934b0.
        # Includes per-user node shims, private fallback, and executable NODE paths.
        # WebKit commit 440fe0f8519ea493007a5161813e45b2aeaca2c5.
        # Includes the FTL bounds-check and Intl.Segmenter fixes.
        bun_dir="$(mktemp -d "$RUNNER_TEMP/openclaw-test-bun.XXXXXX")"
        archive="$bun_dir/bun-linux-x64.gz"
        curl --fail --location --no-progress-meter --show-error \
          --connect-timeout 10 --max-time 300 \
          --retry 3 --retry-all-errors --retry-max-time 300 \
          --output "$archive" \
          "https://github.com/steipete/bun/releases/download/openclaw-ci-9ebee125-webkit-440fe0f8/bun-linux-x64.gz" \
          2> >(sed 's/^Warning: /::warning::/' >&2)
        printf '%s  %s\n' \
          '27b37643fa5a361079e44507fc07ac6d2588058ae528cbf02fc6e6f814403611' \
          "$archive" | sha256sum --check -
        gzip --decompress --stdout "$archive" > "$bun_dir/bun"
        printf '%s  %s\n' \
          'e1adaca9e59f8f15677dc30a07917f2a30cee0dd6ddba10d606c9309177d142b' \
          "$bun_dir/bun" | sha256sum --check -
        chmod 755 "$bun_dir/bun"
        "$bun_dir/bun" --version
        "$bun_dir/bun" --revision
        rm "$archive"
        echo "$bun_dir" >> "$GITHUB_PATH"
